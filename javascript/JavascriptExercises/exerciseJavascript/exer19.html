<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = parseFloat(prompt("nota1: "))
        let n2 = parseFloat(prompt("nota2: "))
        let n3 = parseFloat(prompt("nota3: "))

        let m = (n1 + n2 + n3) /3
        if ( m > 7){
            document.write("Você foi aprovado, "+"sua nota é: "+ m.toFixed(2)
            )
        }
        else if( m < 7){
            document.write("Você foi reprovado "+" sua nota é: "+ m.toFixed(2)
            )
        }
        else{
            document.write("por gentileza, repita novamente.")
        }
    </script>
</body>
</html>
