<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let guarda = parseFloat(prompt("Digite o valor mensal guardado: R$ "))
        let meses = parseInt(prompt("Digite o mês para calcular: "))
        let poupa = guarda * meses

        let montante = poupa * 0.60

        document.write("Após " + meses + " meses e o montante é de : " + montante)


    </script>
</body>
</html>
