<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nt1 = parseFloat(prompt("Digite a primeira nota: "))
        let nt2 = parseFloat(prompt("Digite a segunda nota: "))
        let nt3 = parseFloat(prompt("Digite a terceira nota: "))
        
        let mediapon = (nt1 * 2 + nt2 * 3 + nt3 * 5) / 10
        document.write("A média ponderada é: " + mediapon)





</script>

</body>
</html>
