<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nome = prompt("Digite o nome do aluno: ")
        let dis = prompt("Digite a disciplina: ")
        let fault = prompt("QUANTIDADE DE FALTAS: ")
        if (fault > 15){
           document.write("O aluno"+ nome +" . "+ " Na disciplina de," + dis + ". Suas faltas foram de: "+ fault + " .FOI REPROVADO!!")

        } else{
              document.write("O aluno "+ nome +" . "+ " Na disciplina de,  " + dis + " . Suas faltas foram de: "+ fault +" . ")
        }

      


    </script>
</body>
</html>
