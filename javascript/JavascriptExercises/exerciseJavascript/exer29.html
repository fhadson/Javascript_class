<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        let disciplina = prompt("Disciplina: ")
        let nome = prompt("Digite seu nome: ")
        let na = parseInt(prompt("Qual a nota do aluno: "))
        if (na >= 7){
            document.write(nome + " foi Aprovado na disciplina de "+ disciplina)

        } else { 
            document.write(nome + " foi Reprovado na disciplina de "+ disciplina)
        }
</Script>
</body>
</html>
