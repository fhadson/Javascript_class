<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>par ou impar</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Digite um número inteiro: "))
        if (n % 2 === 0){
            document.write(n + " É par")}
        else{ 
            document.write(n + " É impar")
        }
        

    </script>
</body>
</html>
