<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let ini = parseFloat(prompt("Digite seu salario: Ex: 1820 "))
        let novo = ini * 1.15
        document.write("Com reajuste de 15% o seu novo salário é de: "+ novo.toFixed(2))
    </script>
</body>
</html>
