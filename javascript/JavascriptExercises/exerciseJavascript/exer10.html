<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     let n1 = parseInt(prompt("Digite um número inteiro: "));
        document.write("TABUADA" + "<br/>");

        for (let n = 1; n <= 10; n++) {
            const multiplicacao = n1 * n;
            document.write(n1 + " * " + n + " = " + multiplicacao + "<br/>");
        }
    </script>
</body>
</html>
