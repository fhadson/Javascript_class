<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do IMC</title>
</head>
<body>
    <script>
        const peso = parseFloat(prompt("Digite seu peso em kg:"))
        const altura = parseFloat(prompt("Digite sua altura em metros (use ponto, exemplo: 1.75):"))
        const imc = peso / (altura * altura)
        let classificacao

        if (imc < 18.5) {
            classificacao = "Abaixo do peso"
        } else if (imc < 25) {
            classificacao = "Peso adequado"
        } else if (imc < 30) {
            classificacao = "Sobrepeso"
        } else {
            classificacao = "Obesidade"
        }

        document.write("<h1>Resultado do IMC</h1>")
        document.write("IMC: " + imc.toFixed(1) +"<br/>")
        document.write("Classificação: " + classificacao + ", "+ imc.toFixed(1))
    </script>
</body>
</html>
