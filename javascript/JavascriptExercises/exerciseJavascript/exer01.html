<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculando IMC(não utilizar como base)</title>
</head>
<body>
    <script>
        let n1 = parseFloat(prompt("Digite um numero: "))
        let n2 = parseFloat(prompt("Digite outro numero: "))
        let soma = n1 + n2
        let subtracacao = n1 - n2
        let mulplicacao = n1 * n2
        let divisao  = n1 / n2

        document.write("A soma dos numeros é: " + soma + "<br>")
        document.write("A subtração dos numeros é: " +
            subtracacao + "<br>")
        document.write("A multiplicação dos numeros é: " + multiplicacao + "<br>")
        document.write("A divisão dos numeros é: " + 
        divisao + "<br>")
        







</script>
    </body>
</html>
