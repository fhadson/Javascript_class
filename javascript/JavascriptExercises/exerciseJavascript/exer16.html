<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n =parseInt(prompt("Digite um numero: "))
        if (n > 0){
            document.write(n +" é um número é positivo.")
           
        }
         else if (n == 0 ){
                 document.write("É zero.")
            }
        else {
             document.write(n +" é um número é negativo.")
        }
    </script>
</body>
</html>
