<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando variaveis no Javascript</title>
</head>
<body>
    <h1>    Testando variaveis      </h1>

    <script>

         let idade = 54 // variavel do tipo inteiro (somente números)
         let peso = 77.200 //variavel do tipo float(somente números quebrados)
         let altura = 1.78
         let nome = "Debora Paixão" //variavel tipo string (letras,números e caracteres)
          document.write("Meu nome é: " + nome + "<br>" )
          document.write("Meu peso é: " + peso + "<br>")
          document.write("Minha idade é: " + idade + "<br>")
          document.write("Minha altura: " + altura + "<br>")
         </script>
</body>
</html>
