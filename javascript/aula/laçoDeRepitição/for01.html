<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
        let soma = 0
        for(let i=1; i<=10; i++){
            let numero = Number(prompt("Digite um número"))
            soma = soma + numero
        }
        document.write("Seu total de soma é: " + soma)


    </script>   
    
</body>
</html>
