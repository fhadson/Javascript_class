<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculando IMC(não utilizar como base)</title>
</head>
<body>
    <script>
        let peso = parseFloat(prompt("Digite seu peso : "))
        let altura = parseFloat(prompt("Digite sua altura: "))
        let imc = (peso / (altura * altura)) 
        document.write("Seu IMC(Indíce de Massa Corporal) é: " + imc.toFixed(1))
        
        if (imc <= 18.5)
           { document.write("<br>" +"Você está abaixo do peso."  + "<br>")}
        else if (imc >= 18.6 && imc <= 24.9 ){
            document.write("<br>" +"Você está com peso normal."  + "<br>")
        }
         else if (imc >= 25 && imc <= 29.9 ){
            document.write( "<br>" + "Você está acima do peso."  + "<br>")
        }
         else if (imc >= 30 && imc <= 39.9 ){
            document.write("<br>" +"Você está com obesidade grau 1."  + "<br>")
        }
         else if (imc >= 40 ) {
            document.write("<br>" +"Você está com obesidade grau 2."  + "<br>")
         }
        



    </script>
</body>
</html>
