<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando calculos com Javascript</title>
</head>
<body>
    <h1>   Testando calculos com o Javascript    </h1>

    <script> 
        let n1 = parseFloat(prompt("Entre com o primeiro numero: "))
        let n2 = parseFloat(prompt("entre com o segundo número: "))

        document.write(" O primeiro número inserido foi:" + n2 + "<br>")
        document.write(" O segundo número inserido foi:" + n2 + "<br>")

        let soma = n1 + n2
        let multiplicacao = n1 * n2
        let divisao = n1 / n2
        let subtracao = n1 - n2





        document.write("A soma dos números é: " + soma +  "<br>")

        document.write(" A multiplicação dos números é: " + multiplicacao + "<br>")

        document.write(" A subtração é: " + subtracao + "<br>")

        document.write(" A divisão é: " + divisao +  "<br>")
    
    </script>
</body>
</html>
