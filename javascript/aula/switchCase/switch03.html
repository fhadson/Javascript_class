<!DOCTYPE html>
<html lang="en">

<scrip>

    <h1>testando Switch Case</h1>
    <script>

        let cargo = prompt("Digite seu cargo: (supervisor, gerente, funcionario ou diretor)")

    switch(cargo){
        case "supervisor":
            document.write("Acesso restrito ")
            break
        case "gerente":
            document.write("Acesso restrito")
            break
        case "funcionario":
            document.write("Acesso permitido")
            break
        case "diretor":
            document.write("Acesso restrito")
            break
            default:
                document.write("Cargo não encontrado")
        
    }
    
    </script>

</html>
