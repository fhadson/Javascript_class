<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>fast food</h2>
    <script>

        let food = prompt("Digite seu pedido, escolha pelo numero:")

        switch (food){

            case "1":
                alert("hamburguer , R$ 10,00")
            break
            case "2":
                alert("pizza, R$ 1000,00")
            break
            case "3":
                alert("sanduiche, R$ 20,00")
            break
            case "4":
                alert("milkshake, R$ 400,00")
            break
            case "5":
                alert("batata frita, R$ 4,00")
                break
                default:
                    alert("opção invalida ")
        }



       </script>
</body>
</html>
